<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypeFight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
 :root{
  /* Midnight palette: ink navy, cool slate, soft mint and muted coral. */
  color-scheme:dark;
  --bg:#0B1220; --bg2:#111D30; --card:#172337; --card2:#1D2C43; --line:#34465D;
  --ink:#F2F5F8; --muted:#A5B2C4;
  --p:#73DCC2; --p-d:#3DAD97; --e:#F08D96; --e-d:#A94C5E;
  --combo:#E9CB83; --crit:#F0A36B; --blue:#93B5FF; --violet:#C4A7F4;
  --button-text:#092B26; --button-shadow:0 10px 24px -12px rgba(78,205,174,.34);
  --button-shadow-hover:0 14px 28px -12px rgba(78,205,174,.46);
  --glow-a:rgba(120,145,220,.16); --glow-b:rgba(92,207,185,.10);
  --hp-back:#0A111D; --hp-me-glow:rgba(115,220,194,.38); --hp-en-glow:rgba(240,141,150,.34);
  --bruise-fill:rgba(105,35,61,.88); --bruise-stroke:rgba(12,18,32,.52);
  --burst-en:rgba(240,141,150,.62); --burst-me:rgba(242,245,248,.48);
  --crit-glow:rgba(240,163,107,.52); --combo-glow:rgba(233,203,131,.34);
  --bad-bg:rgba(240,141,150,.16); --shield:#A9D9F2;
  --divider:rgba(165,178,196,.12); --panel-shadow:0 12px 30px -20px rgba(0,0,0,.62);
  --tier-basic:rgba(115,220,194,.34); --tier-medium:rgba(147,181,255,.34); --tier-advanced:rgba(196,167,244,.34);
  --font:"Sora",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(circle at 12% -8%,var(--glow-a),transparent 43%),radial-gradient(circle at 92% 5%,var(--glow-b),transparent 40%),linear-gradient(155deg,var(--bg2),var(--bg) 64%);
  color:var(--ink);font-family:var(--font);min-height:100vh;overflow-x:hidden;
  transition:background .3s ease,color .25s ease;
}
body[data-theme="paper"]{
  --bg:#F1F2EE; --bg2:#E7EBE6; --card:#FAFBF8; --card2:#FFFFFF; --line:#D8E0D9;
  --ink:#202D32; --muted:#5C6D69;
  --p:#24725F; --p-d:#17594D; --e:#A94C56; --e-d:#823D48;
  --combo:#875719; --crit:#994C2B; --blue:#3E6096; --violet:#6B548B;
  --button-text:#FFFFFF; --button-shadow:0 9px 22px -12px rgba(40,124,105,.28);
  --button-shadow-hover:0 13px 26px -12px rgba(40,124,105,.38);
  --glow-a:rgba(99,139,121,.12); --glow-b:rgba(167,142,108,.10);
  --hp-back:#E8EDE8; --hp-me-glow:rgba(40,124,105,.20); --hp-en-glow:rgba(169,76,86,.20);
  --bruise-fill:rgba(130,61,72,.72); --bruise-stroke:rgba(65,43,47,.28);
  --burst-en:rgba(169,76,86,.32); --burst-me:rgba(40,124,105,.24);
  --crit-glow:rgba(153,76,43,.22); --combo-glow:rgba(135,87,25,.18);
  --bad-bg:rgba(169,76,86,.12); --shield:#3E6096;
  --divider:rgba(64,87,78,.13); --panel-shadow:0 12px 28px -20px rgba(38,57,48,.22);
  --tier-basic:rgba(40,124,105,.28); --tier-medium:rgba(62,96,150,.24); --tier-advanced:rgba(107,84,139,.24);
  background:radial-gradient(circle at 12% -8%,var(--glow-a),transparent 43%),radial-gradient(circle at 92% 5%,var(--glow-b),transparent 40%),linear-gradient(155deg,var(--bg2),var(--bg) 64%);
}
.wrap{max-width:1180px;margin:0 auto;padding:26px 30px 56px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:1.1rem}
.brand-home{appearance:none;border:0;padding:0;background:transparent;color:var(--ink);font-family:var(--font);line-height:1;cursor:pointer;text-align:left;}
.brand-home:hover{filter:brightness(1.08)}
.brand-home:focus-visible{outline:2px solid var(--p);outline-offset:6px;border-radius:4px}
.brand span{color:var(--p)}
.hdr-right{display:flex;align-items:center;gap:8px}
.lvl{font-family:var(--mono);font-size:.82rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px}
.mute{font:inherit;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:1rem;line-height:1}
.mute.on{color:var(--violet);border-color:var(--violet)}
.theme-toggle{font:inherit;background:var(--card);border:1px solid var(--line);color:var(--combo);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:1rem;line-height:1;display:grid;place-items:center;transition:background .18s,border-color .18s,color .18s}
.theme-toggle:hover{border-color:var(--p);color:var(--p)}
:focus-visible{outline:2px solid var(--p);outline-offset:3px}
.screen{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.center{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
/* Speed test uses its own scrollable text window, not a vertically centered page. */
.speed-screen{min-height:calc(100vh - 105px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:14px;padding:10px 0 28px}
.speed-viewport{width:min(100%,560px);height:clamp(220px,38vh,340px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;scroll-behavior:auto;border-radius:16px;}
.target.speed-target{width:100%;max-width:none!important;min-height:100%;margin:0!important;padding:20px 22px;text-align:left;font-size:1.08rem;line-height:1.9;}
#speedTypebox{position:fixed!important;left:0!important;top:0!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;}
@media(max-width:520px){.speed-viewport{height:clamp(210px,34vh,290px)}.target.speed-target{font-size:1rem;padding:16px}}

/* Desktop-first battle layout */
@media(min-width:900px){
  .wrap{padding:28px 34px 64px}
  header{margin-bottom:24px}
  .brand{font-size:1.28rem}
  .arena{gap:22px;margin-bottom:14px}
  .fighter{padding:20px 26px 22px;border-radius:22px;min-height:270px}
  .fighter .name{font-size:1rem;margin-bottom:8px}
  .stage{height:224px;min-height:224px;padding-top:18px;align-items:center;overflow:visible}
  .stage .stick{width:98px;height:182px;flex:0 0 auto;display:block;overflow:visible}
  .hpwrap{height:15px;margin-top:12px}
  .progress{font-size:1.35rem;gap:14px;margin-bottom:20px}
  .fight-topbar{margin-bottom:12px}
  .fight-mode-label{font-size:.76rem;letter-spacing:.14em}
  .pause-btn{font-size:.9rem;padding:10px 17px}
  .hud{font-size:.92rem;gap:20px;margin:8px 0 18px}
  .target.combat-target{max-width:1060px;margin:20px auto 0;padding:30px 42px;min-height:116px;font-size:1.38rem;line-height:1.9}
  .fight-hint{font-size:.9rem;margin-top:14px}
  .boss-shield-visual{width:154px;height:174px}
  .shield-tag{font-size:.72rem;padding:5px 11px}
}
.fight-topbar{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin:0 0 8px}
.fight-mode-label{font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pause-btn{font:inherit;font-size:.82rem;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 13px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.pause-btn:hover{border-color:var(--p);background:var(--card2);transform:translateY(-1px)}
.pause-screen{min-height:62vh;display:flex;align-items:center;justify-content:center;text-align:center}
.pause-card{width:min(100%,480px);background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:34px 36px;box-shadow:var(--panel-shadow)}
.pause-mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;margin:0 auto 14px;background:var(--bg2);border:1px solid var(--line);color:var(--p);font-size:1.5rem}
.pause-meta{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:18px 0 22px;color:var(--muted);font: .82rem var(--mono)}
.pause-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pause-actions .btn{min-width:150px}
.shield-tag{display:inline-flex;align-items:center;gap:5px;margin-left:9px;vertical-align:middle;border-radius:99px;border:1px solid var(--shield);background:color-mix(in srgb,var(--shield) 15%,transparent);color:var(--shield);font:700 .62rem var(--mono);letter-spacing:.04em;padding:4px 8px;white-space:nowrap}
.boss-shield-visual{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:128px;height:148px;z-index:1;pointer-events:none;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--shield) 48%,transparent));}
.boss-shield-visual::before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,color-mix(in srgb,var(--shield) 30%,transparent),color-mix(in srgb,var(--shield) 8%,transparent));clip-path:polygon(50% 0,94% 16%,86% 67%,50% 100%,14% 67%,6% 16%);border:0;}
.boss-shield-visual::after{content:"";position:absolute;inset:5px;background:transparent;border:2px solid color-mix(in srgb,var(--shield) 82%,white);clip-path:polygon(50% 0,94% 16%,86% 67%,50% 100%,14% 67%,6% 16%);opacity:.9;}
.boss-shield-visual span{position:absolute;z-index:1;top:7px;left:50%;transform:translateX(-50%);font-size:31px;line-height:1;text-shadow:0 0 12px var(--shield)}
.stage.enemy-defeat .stick{animation:enemyDefeated .82s cubic-bezier(.16,.72,.25,1) forwards}
.stage.enemy-defeat .boss-shield-visual{animation:shieldShatter .55s ease-out forwards}
@keyframes enemyDefeated{0%{opacity:1;transform:translateY(0) rotate(0) scale(1)}24%{opacity:1;transform:translateY(-10px) rotate(-9deg) scale(1.12)}58%{opacity:.82;transform:translateY(8px) rotate(16deg) scale(.88)}100%{opacity:0;transform:translateY(42px) rotate(42deg) scale(.35);filter:blur(4px)}}
@keyframes shieldShatter{0%{opacity:1;transform:translateX(-50%) scale(1)}45%{opacity:.9;transform:translateX(-50%) scale(1.12)}100%{opacity:0;transform:translateX(-50%) scale(1.55) rotate(9deg);filter:blur(5px)}}
.defeat-ring{position:absolute;left:50%;top:48%;width:32px;height:32px;border:3px solid var(--crit);border-radius:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;animation:defeatRing .78s ease-out forwards}
@keyframes defeatRing{0%{opacity:1;transform:translate(-50%,-50%) scale(.3);border-width:7px}100%{opacity:0;transform:translate(-50%,-50%) scale(4.8);border-width:1px}}
.defeat-particle{position:absolute;left:50%;top:48%;width:9px;height:9px;border-radius:3px;background:var(--e);z-index:5;pointer-events:none;box-shadow:0 0 12px var(--burst-en);animation:defeatParticle .76s cubic-bezier(.12,.7,.24,1) forwards}
@keyframes defeatParticle{0%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15) rotate(var(--rot))}}
@media(prefers-reduced-motion:reduce){.stage.enemy-defeat .stick,.stage.enemy-defeat .boss-shield-visual,.defeat-ring,.defeat-particle{animation-duration:.01ms!important}}


/* Desktop home and timed-test layouts */
.home-screen{width:min(100%,1120px);margin:0 auto;}
.home-copy{display:flex;flex-direction:column;align-items:center;gap:16px;}
.home-kicker{font:700 .74rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.home-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.home-panel{width:100%;max-width:480px;text-align:left;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--panel-shadow);}
.home-panel-kicker{font:700 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--p);margin-bottom:10px;}
.home-panel h2{font-size:1.35rem;line-height:1.3;margin:0 0 8px;}
.home-panel p{font-size:.92rem;line-height:1.6;color:var(--muted);margin:0 0 22px;}
.home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.home-stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 12px;}
.home-stat b{display:block;font:700 1.35rem var(--mono);color:var(--ink);margin-bottom:4px;}
.home-stat span{font-size:.72rem;color:var(--muted);line-height:1.35;}
.tier-highscore{display:inline-block;font:700 .76rem var(--mono);color:var(--combo)!important;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;margin-top:8px;}
.tier-select-screen{width:min(100%,900px);}
.tier-select-screen .tiers{max-width:780px;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px;}
.tier-select-screen .tiercard{min-height:170px;padding:22px;}
.tutorial-screen{width:min(100%,780px);}
.speed-test-toolbar{width:min(100%,1040px);display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:18px;}
.speed-test-toolbar h1{text-align:left;}
.speed-viewport{width:min(100%,1000px);height:clamp(320px,48vh,500px);}
.target.speed-target{font-size:1.26rem;line-height:2.05;padding:30px 42px;}
.speed-pause-screen{min-height:62vh;display:flex;align-items:center;justify-content:center;text-align:center;}
.speed-pause-card{width:min(100%,500px);background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:var(--panel-shadow);}
.speed-pause-meta{font: .88rem var(--mono);color:var(--muted);margin:18px 0 24px;}
@media(min-width:900px){
  .home-screen{min-height:calc(100vh - 190px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);align-items:center;gap:68px;text-align:left;}
  .home-copy{align-items:flex-start;}
  .home-copy h1{font-size:clamp(3.6rem,6vw,5.4rem);letter-spacing:-.055em;}
  .home-copy .sub{font-size:1.08rem;max-width:580px;}
  .home-actions{justify-content:flex-start;margin-top:14px;}
  .home-panel{max-width:none;padding:36px;}
  .tier-select-screen{min-height:calc(100vh - 180px);justify-content:center;}
  .tier-select-screen .sub{max-width:660px;}
  .tutorial-screen{min-height:calc(100vh - 180px);justify-content:center;}
  .speed-screen{min-height:calc(100vh - 150px);gap:20px;padding:8px 0 34px;}
  .speed-test-toolbar{grid-template-columns:1fr auto auto;}
}
/* Center the play experiences on desktop, with the content kept in a calm, readable column. */
.home-screen{position:relative;padding-bottom:54px;}
.home-signature{
  position:absolute;left:0;right:0;bottom:10px;text-align:center;
  font:700 .74rem var(--mono);letter-spacing:.16em;color:var(--muted);
  opacity:.82;user-select:none;
}
.fight-screen{
  width:min(100%,1100px);margin:0 auto;
  min-height:calc(100vh - 220px);
  display:flex;flex-direction:column;justify-content:center;
}
.speed-menu-screen{
  width:min(100%,760px);margin:0 auto;
  min-height:calc(100vh - 220px);justify-content:center;
}
.speed-screen{
  width:min(100%,1080px);margin:0 auto;
  min-height:calc(100vh - 190px);
  justify-content:center;align-items:center;
}
/* Keep every bounded screen centered within the full application viewport. */
.tutorial-screen,.tier-select-screen{margin-inline:auto;}
/* Center the speed-test title independently of the timer and pause controls. */
.speed-test-toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  grid-template-areas:"timer title pause";
  align-items:center;
  gap:18px;
}
.speed-test-toolbar h1{grid-area:title;justify-self:center;text-align:center;}
#speedTimer{grid-area:timer;justify-self:start;}
#speedPauseBtn{grid-area:pause;justify-self:end;}
@media(max-width:899px){
  .speed-test-toolbar{
    grid-template-columns:1fr auto;
    grid-template-areas:"title title" "timer pause";
    gap:12px;
  }
  .speed-test-toolbar h1{justify-self:center;text-align:center;}
  #speedTimer{justify-self:end;}
  #speedPauseBtn{justify-self:start;}
}
@media(min-width:900px){
  .home-screen{padding-bottom:58px;}
  .fight-screen{min-height:calc(100vh - 230px);}
  .speed-menu-screen{min-height:calc(100vh - 230px);}
  .speed-screen{min-height:calc(100vh - 230px);}
}
@media(max-width:899px){
  .home-screen{max-width:680px;}
  .home-panel{margin-top:12px;}
  .speed-test-toolbar{grid-template-columns:1fr auto;}
  .speed-test-toolbar h1{grid-column:1/-1;text-align:center;}
  .speed-viewport{height:clamp(240px,42vh,380px);}
  .target.speed-target{font-size:1.08rem;line-height:1.9;padding:20px 22px;}
  .tier-select-screen .tiers{grid-template-columns:1fr;}
}

h1{font-size:clamp(1.8rem,7vw,2.6rem);margin:0;letter-spacing:-.02em;font-weight:800}
h1 span{color:var(--p)}
p.sub{color:var(--muted);margin:0;max-width:460px;line-height:1.5}
.btn{font:inherit;font-weight:700;background:linear-gradient(135deg,var(--p),var(--p-d));color:var(--button-text);border:0;border-radius:14px;padding:14px 28px;cursor:pointer;font-size:1.05rem;box-shadow:var(--button-shadow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--button-shadow-hover)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.progress{display:flex;gap:10px;justify-content:center;margin-bottom:16px;font-size:1.2rem}
.progress .pf{opacity:.3;transition:transform .2s,opacity .2s}
.progress .pf.done{opacity:1;color:var(--p)}
.progress .pf.cur{opacity:1;color:var(--combo);transform:scale(1.35)}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fighter{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--panel-shadow)}
.fighter .name{font-weight:700;font-size:.85rem;margin-bottom:6px}
.fighter.enemy .name{color:var(--e)}
.fighter.me .name{color:var(--p)}
.hpwrap{height:12px;border-radius:99px;background:var(--hp-back);overflow:hidden;margin-top:8px;border:1px solid var(--line);box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.hp{height:100%;border-radius:99px;transition:width .25s ease}
.hp.me{background:linear-gradient(90deg,var(--p-d),var(--p));box-shadow:0 0 9px var(--hp-me-glow)}
.hp.en{background:linear-gradient(90deg,var(--e-d),var(--e));box-shadow:0 0 9px var(--hp-en-glow)}
.stage{position:relative;height:168px;min-height:168px;padding-top:10px;display:flex;align-items:center;justify-content:center;overflow:visible}
.fighter.me .stick{color:var(--p)}
.fighter.enemy .stick{color:var(--e)}
.stick{width:70px;height:130px;position:relative;z-index:2;flex:0 0 auto;display:block;overflow:visible;transform-origin:50% 100%}
.stick.flinch{animation:flinch .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes flinch{
  0%{transform:translateX(0) rotate(0)}
  12%{transform:translateX(-9px) rotate(-7deg)}
  28%{transform:translateX(12px) rotate(9deg) scaleX(1.05)}
  45%{transform:translateX(-8px) rotate(-6deg)}
  62%{transform:translateX(6px) rotate(4deg)}
  80%{transform:translateX(-3px) rotate(-2deg)}
  100%{transform:translateX(0) rotate(0)}
}
.bruise{opacity:0;transition:opacity .25s ease;fill:var(--bruise-fill);stroke:var(--bruise-stroke);stroke-width:1}
.stick.dmg-mid .bruise.b1{opacity:.78}
.stick.dmg-low .bruise.b1,.stick.dmg-low .bruise.b2{opacity:.9}
.stick.dmg-low .bruise.b3{opacity:.72}
.stick.dmg-crit .bruise.b1,.stick.dmg-crit .bruise.b2,.stick.dmg-crit .bruise.b3{opacity:1}
.stick.dmg-crit .bruise.b4,.stick.dmg-crit .bruise.b5{opacity:.9}
.burst{position:absolute;left:50%;top:58%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;pointer-events:none;animation:burstAnim .45s ease-out forwards;z-index:1}
.burst.enemy{background:radial-gradient(circle,var(--burst-en),transparent 70%)}
.burst.me{background:radial-gradient(circle,var(--burst-me),transparent 70%)}
@keyframes burstAnim{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.1);opacity:0}}
.pop{position:absolute;top:6px;font-family:var(--mono);font-weight:700;font-size:1.1rem;color:var(--combo);pointer-events:none;animation:pop .75s ease forwards;z-index:3;white-space:nowrap;left:50%}
.pop.crit{color:var(--crit);font-size:1.5rem;text-shadow:0 0 14px var(--crit-glow)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.06)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.hud{display:flex;gap:10px;justify-content:center;margin:4px 0 16px;font-family:var(--mono);font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.hud b{color:var(--ink)}
.combo-tag{color:var(--combo);text-shadow:0 0 8px var(--combo-glow)}

/* Live fight statistics and progression */
.campaign-progress{width:100%;max-width:1060px;margin:0 auto 13px;text-align:left}
.campaign-progress-head,.sentence-progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;font:700 .7rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.campaign-progress-head strong,.sentence-progress-head strong{color:var(--ink);font-weight:700;letter-spacing:.04em}
.progress-track{height:7px;width:100%;border-radius:99px;background:var(--hp-back);border:1px solid var(--line);overflow:hidden}
.progress-track>span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p-d),var(--p));box-shadow:0 0 12px var(--hp-me-glow);transition:width .28s ease}
.fight-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:1060px;margin:0 auto 13px}
.fight-stat{min-width:0;background:linear-gradient(155deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:12px 15px;text-align:left;box-shadow:var(--panel-shadow)}
.fight-stat span{display:block;color:var(--muted);font:700 .64rem var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.fight-stat b{display:block;font:700 1.3rem var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.fight-stat.speed b{color:var(--blue)}.fight-stat.accuracy b{color:var(--p)}.fight-stat.combo b{color:var(--combo)}.fight-stat.damage b{color:var(--crit)}
.sentence-progress{width:100%;max-width:1060px;margin:0 auto 9px;text-align:left}
.sentence-progress .progress-track{height:5px}
.sentence-progress .progress-track>span{background:linear-gradient(90deg,var(--blue),var(--p));box-shadow:none}
@media(max-width:700px){.fight-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.fight-stat{padding:10px 12px}.fight-stat b{font-size:1.12rem}}

/* Combat motion: a short forward strike, readable impact, and sharper critical feedback. */
.stage{isolation:isolate}
.stage.attack-lunge .stick{animation:playerStrike .34s cubic-bezier(.2,.8,.25,1) both}
.stage.counter-lunge .stick{animation:enemyStrike .34s cubic-bezier(.2,.8,.25,1) both}
.stage.impact-hit::after{content:"";position:absolute;inset:12% 12%;border-radius:50%;background:radial-gradient(circle,var(--burst-en),transparent 68%);opacity:0;pointer-events:none;animation:impactFlash .42s ease-out}
.stage.player-impact::after{background:radial-gradient(circle,var(--burst-me),transparent 68%)}
.stage.critical-impact::before{content:"";position:absolute;inset:8% 8%;border:2px solid var(--crit);border-radius:50%;opacity:0;pointer-events:none;animation:criticalRing .52s ease-out}
@keyframes playerStrike{0%{transform:translateX(0) rotate(0) scale(1)}38%{transform:translateX(34px) rotate(8deg) scale(1.08)}70%{transform:translateX(24px) rotate(-3deg) scale(1.04)}100%{transform:translateX(0) rotate(0) scale(1)}}
@keyframes enemyStrike{0%{transform:translateX(0) rotate(0)}40%{transform:translateX(-30px) rotate(-9deg) scale(1.06)}72%{transform:translateX(-18px) rotate(4deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes impactFlash{0%{opacity:.95;transform:scale(.25)}35%{opacity:.75;transform:scale(1.05)}100%{opacity:0;transform:scale(1.7)}}
@keyframes criticalRing{0%{opacity:.95;transform:scale(.25)}100%{opacity:0;transform:scale(1.65)}}
.combat-spark{position:absolute;left:50%;top:48%;width:5px;height:22px;border-radius:99px;background:var(--spark-color,var(--crit));z-index:6;pointer-events:none;box-shadow:0 0 9px var(--spark-color,var(--crit));animation:sparkFly .42s cubic-bezier(.12,.7,.24,1) forwards}
@keyframes sparkFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.45) rotate(var(--rot))}18%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2) rotate(calc(var(--rot) + 110deg))}}
.arena.combo-surge{animation:comboSurge .42s ease-out}
@keyframes comboSurge{0%{filter:none}40%{filter:drop-shadow(0 0 16px var(--combo-glow))}100%{filter:none}}
.arena.ko-shake{animation:koShake .42s ease-in-out}
@keyframes koShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}38%{transform:translateX(6px)}58%{transform:translateX(-4px)}78%{transform:translateX(2px)}}

/* Distinct attack silhouettes make each completed sentence feel like a different move. */
.stage.move-jab .stick{animation:moveJab .42s cubic-bezier(.2,.8,.25,1) both;}
.stage.move-cross .stick{animation:moveCross .48s cubic-bezier(.18,.76,.2,1) both;}
.stage.move-sweep .stick{animation:moveSweep .5s cubic-bezier(.2,.8,.25,1) both;}
.stage.move-heavy .stick{animation:moveHeavy .58s cubic-bezier(.15,.75,.2,1) both;}
.stage.move-rush .stick{animation:moveRush .52s cubic-bezier(.18,.8,.18,1) both;}
.stage.move-finisher .stick{animation:moveFinisher .64s cubic-bezier(.16,.82,.2,1) both;}
.stage.counter-quick .stick{animation:counterQuick .4s ease-out both;}
.stage.counter-heavy .stick{animation:counterHeavy .58s cubic-bezier(.2,.7,.2,1) both;}
.stage.impact-heavy::before{content:"";position:absolute;inset:8%;border:3px solid var(--crit);border-radius:28%;opacity:0;pointer-events:none;animation:heavyRing .55s ease-out;}
.stage.impact-sweep::before{content:"";position:absolute;left:13%;right:13%;bottom:18%;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);box-shadow:0 0 14px var(--blue);opacity:0;pointer-events:none;animation:sweepLine .5s ease-out;}
@keyframes moveJab{0%{transform:translate(0,0) rotate(0)}35%{transform:translate(28px,-2px) rotate(5deg)}58%{transform:translate(33px,-1px) rotate(2deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes moveCross{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(15px,-8px) rotate(-7deg)}62%{transform:translate(34px,2px) rotate(13deg) scale(1.05)}100%{transform:translate(0,0) rotate(0)}}
@keyframes moveSweep{0%{transform:translate(0,0) rotate(0)}35%{transform:translate(15px,8px) rotate(13deg)}65%{transform:translate(30px,6px) rotate(-8deg) scale(1.03)}100%{transform:translate(0,0) rotate(0)}}
@keyframes moveHeavy{0%{transform:translate(0,0) rotate(0) scale(1)}28%{transform:translate(-5px,-8px) rotate(-8deg) scale(1.02)}62%{transform:translate(34px,0) rotate(16deg) scale(1.12)}82%{transform:translate(17px,1px) rotate(6deg) scale(1.06)}100%{transform:translate(0,0) rotate(0) scale(1)}}
@keyframes moveRush{0%{transform:translate(0,0) scale(1)}24%{transform:translate(12px,-5px) scale(1.04)}48%{transform:translate(34px,-2px) rotate(8deg) scale(1.13)}72%{transform:translate(20px,2px) rotate(-5deg) scale(1.06)}100%{transform:translate(0,0) rotate(0) scale(1)}}
@keyframes moveFinisher{0%{transform:translate(0,0) scale(1)}24%{transform:translate(0,-12px) rotate(-6deg) scale(1.08)}56%{transform:translate(42px,-2px) rotate(15deg) scale(1.2)}78%{transform:translate(22px,2px) rotate(-6deg) scale(1.08)}100%{transform:translate(0,0) rotate(0) scale(1)}}
@keyframes counterQuick{0%{transform:translate(0,0)}42%{transform:translate(-22px,0) rotate(-6deg)}100%{transform:translate(0,0)}}
@keyframes counterHeavy{0%{transform:translate(0,0)}25%{transform:translate(4px,-8px) rotate(7deg)}62%{transform:translate(-34px,1px) rotate(-15deg) scale(1.1)}100%{transform:translate(0,0) rotate(0) scale(1)}}
@keyframes heavyRing{0%{opacity:.9;transform:scale(.65) rotate(0)}100%{opacity:0;transform:scale(1.25) rotate(18deg)}}
@keyframes sweepLine{0%{opacity:0;transform:scaleX(.2)}28%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.1) translateY(-16px)}}
@media(prefers-reduced-motion:reduce){.stage.attack-lunge .stick,.stage.counter-lunge .stick,.stage.impact-hit::after,.stage.critical-impact::before,.combat-spark,.arena.combo-surge,.arena.ko-shake{animation-duration:.01ms!important}}
.target{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;font-family:var(--mono);font-size:1.22rem;letter-spacing:.01em;line-height:1.7;text-align:center;min-height:68px;box-shadow:0 10px 28px -18px rgba(0,0,0,.6);overflow-wrap:break-word;word-break:break-word}
.target span{display:inline}
.target .c-ok{color:var(--p)}
/* Keep the per-key feedback separate from .pop, which is reserved for floating combat text. */
.target .c-ok.key-pop{display:inline-block;position:relative;top:auto;left:auto;z-index:auto;animation:keypop .12s ease-out}
@keyframes keypop{0%{transform:scale(1.08)}100%{transform:scale(1)}}
.target .c-bad{color:var(--e)}
.target .c-cur.c-bad{animation:none;border-color:var(--e);background:var(--bad-bg);border-radius:3px}

@keyframes blink{50%{border-color:transparent}}
#typebox,#tutTypebox,#speedTypebox{position:absolute;left:-9999px}
.shield{display:inline-block;margin-left:6px;color:var(--shield)}
.hint{text-align:center;color:var(--muted);font-size:.82rem;margin-top:10px}
.boss-tag{display:inline-block;background:var(--e-d);color:#fff;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.result{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;font-size:.92rem;width:100%;max-width:420px;box-shadow:var(--panel-shadow)}
.result .row{display:flex;justify-content:space-between;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--divider)}

.result .row.score{margin-top:4px;padding-top:10px;border-top:1px dashed var(--line);border-bottom:0}
.result .row.score b{color:var(--combo);font-size:1.1rem}
.stage-records{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin-top:10px;text-align:left;box-shadow:var(--panel-shadow)}
.records-title{font-size:.83rem;font-weight:700;color:var(--muted);margin-bottom:9px}
.record-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.record-item{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--divider)}
.record-item b{font-family:var(--mono);color:var(--ink)}
.howto{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:10px 0 18px;max-width:460px;box-shadow:var(--panel-shadow)}
.howto li{margin-bottom:8px;font-size:.92rem;color:var(--muted);line-height:1.45}

.tiercard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,transform .12s}

.tiercard b{font-size:1.05rem}
.tiercard span{color:var(--muted);font-size:.85rem}
.tiercard.basic{border-color:var(--tier-basic)}
.tiercard.basic:hover,.tiercard.basic b{color:var(--p)}

@media(max-width:420px){.record-grid{grid-template-columns:1fr}.target{font-size:1.05rem;padding:18px 13px}}

}

/* Dashboard + compact desktop battle viewport */
.dashboard-screen{width:min(100%,1120px);margin:0 auto;display:flex;flex-direction:column;gap:22px;padding:8px 0 28px;}

.dashboard-profile{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.72fr);gap:18px;align-items:center;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:var(--panel-shadow);}
.dashboard-profile-copy .eyebrow{font:700 .68rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--p);margin-bottom:8px;}

.dashboard-profile-copy p{color:var(--muted);font-size:.88rem;line-height:1.5;margin:0;}
.nickname-form{display:flex;gap:9px;align-items:center;min-width:0;}
.nickname-input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--ink);font:600 .9rem var(--font);padding:12px 13px;outline:none;}

.dash-save-note{font-size:.72rem;color:var(--p);min-height:1em;margin-top:5px;text-align:right;}
.dashboard-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.dashboard-stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--panel-shadow);min-width:0;}
.dashboard-stat span{display:block;font:700 .64rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.dashboard-stat b{display:block;font:700 clamp(1.25rem,2vw,1.7rem) var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dashboard-stat small{display:block;color:var(--muted);font-size:.72rem;margin-top:5px;}
.dashboard-lower{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:16px;}
.dashboard-panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px 20px;box-shadow:var(--panel-shadow);text-align:left;}

.recent-item:last-child{border-bottom:0;}
.recent-item strong{display:block;font-size:.82rem;color:var(--ink);}
.recent-item span{display:block;font-size:.72rem;color:var(--muted);margin-top:3px;}

.dashboard-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.home-actions .dashboard-btn{padding:12px 18px;font-size:.9rem;}

/* Keep the entire live battle on screen at desktop sizes: the text area and arena share available height. */
body[data-screen="fight"]{height:100%;height:100dvh;overflow:hidden;}
body[data-screen="fight"] .wrap{width:100%;max-width:1480px;height:100%;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:12px clamp(18px,3vw,44px) 14px;}

body[data-screen="fight"] .boss-shield-visual{width:clamp(112px,11vw,150px);height:clamp(124px,18vh,170px);top:0;}
body[data-screen="fight"] .hpwrap{height:11px;margin-top:6px;flex:0 0 auto;}
body[data-screen="fight"] .hud{margin:0;gap:16px;font-size:.75rem;}

@media(max-height:760px) and (min-width:900px){

/* Extra combat variety: rising strikes, rotations, dash-ins and opponent specials. */
.stage.move-uppercut .stick{animation:moveUppercut .54s cubic-bezier(.16,.82,.22,1) both;}
.stage.move-spin .stick{animation:moveSpin .64s cubic-bezier(.18,.75,.18,1) both;}
.stage.move-dash .stick{animation:moveDash .48s cubic-bezier(.15,.84,.2,1) both;}
.stage.move-double .stick{animation:moveDouble .60s cubic-bezier(.18,.8,.2,1) both;}
.stage.counter-uppercut .stick{animation:counterUppercut .52s cubic-bezier(.2,.8,.2,1) both;}
.stage.counter-double .stick{animation:counterDouble .60s cubic-bezier(.18,.8,.2,1) both;}

function emptyProfile(){
  return {
    nickname:"Player",
    stats:{fightsPlayed:0,fightsWon:0,campaignsStarted:0,campaignsWon:0,speedTests:0,customSpeedTests:0,bestSpeedWpm:0,bestSpeedAccuracy:0,longestSpeedTestSeconds:0,bestFightWpm:0,totalCorrectChars:0,totalMistakes:0,totalSentences:0,totalDamage:0,totalTypingMs:0,endlessRuns:0,endlessBestScore:0,endlessBestWave:0,endlessEnemiesDefeated:0,endlessEasyBestScore:0,endlessEasyBestWave:0,endlessHardBestScore:0,endlessHardBestWave:0,bossesDefeated:0,totalXP:0,tutorialEndlessWins:0},
    achievements:[],
    recent:[]
  };
}
function loadProfile(){
  const fallback = emptyProfile();
  try{
    const saved = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
    if(!saved || typeof saved !== "object") return fallback;
    const stats = saved.stats || {};
    Object.keys(fallback.stats).forEach(key=>{
      const value = Number(stats[key]);
      fallback.stats[key] = Number.isFinite(value) && value >= 0 ? value : 0;
    });
    // Preserve records from the original single-difficulty Endless mode as Easy records.
    if(stats.endlessEasyBestScore == null) fallback.stats.endlessEasyBestScore = fallback.stats.endlessBestScore || 0;
    if(stats.endlessEasyBestWave == null) fallback.stats.endlessEasyBestWave = fallback.stats.endlessBestWave || 0;
    fallback.stats.longestSpeedTestSeconds = Math.max(fallback.stats.longestSpeedTestSeconds||0,Number(stats.longestSpeedTestSeconds)||0);
  fallback.nickname = String(saved.nickname || "Player").trim().slice(0,18) || "Player";
    fallback.achievements = Array.isArray(saved.achievements) ? saved.achievements.filter(x=>typeof x === "string") : [];
    fallback.recent = Array.isArray(saved.recent) ? saved.recent.slice(0,8).filter(x=>x && typeof x === "object").map(x=>({
      mode:String(x.mode || "Practice").slice(0,24), label:String(x.label || "Session").slice(0,50),
      wpm:Math.max(0,Number(x.wpm)||0), accuracy:Math.max(0,Math.min(100,Number(x.accuracy)||0)),
      date:String(x.date || "")
    })) : [];
  }catch(e){ /* Profiles are optional; the game stays usable if storage is blocked. */ }
  return fallback;
}

function saveProfile(){

function profileOverallAccuracy(){
  const attempts = profile.stats.totalCorrectChars + profile.stats.totalMistakes;
  return attempts ? Math.round(profile.stats.totalCorrectChars/attempts*100) : 0;
}
function addProfileActivity({mode,label,wpm,accuracy,correctChars,mistakes,durationMs}){
  profile.stats.totalCorrectChars += Math.max(0,correctChars||0);
  profile.stats.totalMistakes += Math.max(0,mistakes||0);
  profile.stats.totalTypingMs += Math.max(0,durationMs||0);
  profile.recent.unshift({mode,label,wpm:Math.max(0,wpm||0),accuracy:Math.max(0,accuracy||0),date:new Date().toISOString()});
  profile.recent = profile.recent.slice(0,8);
  saveProfile();
}
function recordFightProfileResult(won){
  if(state.profileStageRecorded) return;
  const stats = statsFrom(state.correctChars,state.mistakeKeys,state.wpmSum,state.wpmCount);
  profile.stats.fightsPlayed++;
  if(won) profile.stats.fightsWon++;
  profile.stats.totalSentences += state.totalSentences;
  profile.stats.totalDamage += state.levelDamageDealt;
  profile.stats.bestFightWpm = Math.max(profile.stats.bestFightWpm,state.bestSentenceWpm||0);
  addProfileActivity({
    mode:won?"Fight won":"Fight ended",label:FIGHTERS[state.levelIdx].name+" · "+TIER_INFO[state.tier].label,
    wpm:stats.avgWpm,accuracy:stats.accuracy,correctChars:state.correctChars,mistakes:state.mistakeKeys,durationMs:fightElapsedMs()
  });
  state.profileStageRecorded = true;
  awardXP(won?45:14,won?"Fight victory":"Fight completed");
}

  while(level<99 && xp>=xpForLevel(level+1)) level++;
  const floor=xpForLevel(level),next=xpForLevel(level+1);
  const ranks=[{at:1,name:"Rookie"},{at:2,name:"Challenger"},{at:4,name:"Striker"},{at:7,name:"Veteran"},{at:10,name:"Elite"},{at:15,name:"Legend"},{at:25,name:"Mythic"}];
  const rank=ranks.filter(r=>level>=r.at).pop().name;
  return {level,xp,rank,into:xp-floor,needed:next-floor,progress:Math.max(0,Math.min(100,(xp-floor)/(next-floor)*100))};
}
function checkAchievements(){

let audioCtx = null;
function ensureAudio(){
  if(state.muted) return null;
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur, type, vol){
  const ctx = ensureAudio(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur);
}
function playClick(){
  // A short burst of filtered noise reads as a mechanical key click, not a tone.
  const ctx = ensureAudio(); if(!ctx) return;
  const dur = 0.018;
  const n = Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buffer = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<n;i++) data[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const filter = ctx.createBiquadFilter(); filter.type = "highpass"; filter.frequency.value = 1500;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.22, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start();
}

// Spans are created once per sentence and only have their class toggled while
// typing, so letters are never removed/recreated mid-word (that was the flicker bug).
function buildSpanBox(boxId, text){
  const box = document.getElementById(boxId);
  if(!box) return;
  box.innerHTML = "";
  box.dataset.cursorLen = "0";
  for(let i=0;i<text.length;i++){
    const sp = document.createElement("span");
    sp.textContent = text[i];
    box.appendChild(sp);
  }
  setCursor(boxId, text, 0);
}
function setCursor(boxId, text, len){
  const box = document.getElementById(boxId);
  if(!box) return;
  const total=box.children.length;
  const next=Math.max(0,Math.min(total,Number(len)||0));
  const previous=Math.max(0,Math.min(total,Number(box.dataset.cursorLen)||0));
  // Only touch the characters crossed by the cursor. This keeps long timed tests
  // responsive even when a 15-minute passage contains several thousand spans.
  if(next>previous){
    for(let i=previous;i<next;i++) box.children[i].className="c-ok";
  }else if(next<previous){
    for(let i=next;i<previous;i++) box.children[i].className="";
  }
  const oldCursor=box.children[previous];
  if(oldCursor && previous!==next) oldCursor.classList.remove("c-cur","c-bad");
  const current=box.children[next];
  if(current) current.className="c-cur";
  box.dataset.cursorLen=String(next);
}
function flashBad(boxId, idx){
  const box = document.getElementById(boxId); if(!box) return;
  const el = box.children[idx]; if(!el) return;
  el.classList.add("c-bad");
  setTimeout(()=>el && el.classList.remove("c-bad"), 160);
}
function popJust(boxId, len){
  const box = document.getElementById(boxId); if(!box) return;
  const el = box.children[len-1]; if(!el) return;
  el.classList.add("key-pop");
  setTimeout(()=>el && el.classList.remove("key-pop"), 120);
}

/* ---------------- PURE SCORING LOGIC ---------------- */
function wpmOf(sentence, ms){
  const words = sentence.trim().split(/\s+/).length;
  const minutes = Math.max(ms, 1) / 60000;
  return Math.round(words / minutes);
}
function calcDamage({sentence, mistakes, wpm, wpmGoal, combo}){
  const words = sentence.trim().split(/\s+/).length;
  const base = words * 6;
  const perfect = mistakes === 0;
  const comboMult = 1 + Math.min(combo, 4) * 0.25;
  const speedMult = wpm >= wpmGoal ? 1.3 : (wpm >= wpmGoal*0.7 ? 1.1 : 1);
  const critMult = perfect ? 1.5 : 1;
  const dmg = Math.round(base * comboMult * speedMult * critMult);
  return {dmg, perfect, crit: perfect, speedBonus: wpm >= wpmGoal};
}
function statsFrom(correctChars, mistakeKeys, wpmSum, wpmCount){
  const total = correctChars + mistakeKeys;
  const accuracy = total > 0 ? Math.round(correctChars/total*100) : 100;
  const avgWpm = wpmCount ? Math.round(wpmSum/wpmCount) : 0;
  const score = Math.round(avgWpm * accuracy);
  return {accuracy, avgWpm, score};
}
function fighterAt(i){
  const f = FIGHTERS[i];
  return {name:f.name, hp:f.hp, atk:f.atk, boss:f.boss, wpmGoal: Math.max(12, f.wpmGoal + (TIER_GOAL_SHIFT[state.tier]||0))};
}

}

/* ---------------- FIGHT FLOW ---------------- */
function resetRun(){
  state.run = {sentences:0, perfect:0, correctChars:0, mistakeKeys:0, wpmSum:0, wpmCount:0, damageDealt:0, bestWpm:0};
}
function startLevel(i){
  clearTimeout(state.defeatTimer);
  clearInterval(state.statsTimer);
  state.statsTimer = null;
  state.defeatTimer = null;
  state.pauseStartedAt = 0;
  state.fightStartedAt = 0; // Live typing statistics begin on the first keypress.
  state.fightPausedAt = 0;
  state.fightPausedTotal = 0;
  state.levelDamageDealt = 0;
  state.bestSentenceWpm = 0;
  state.profileStageRecorded = false;
  state.attackCount = 0;
  state.enemyCounterCount = 0;
  const lv = fighterAt(i);
  state.levelIdx = i;
  state.enemyHp = lv.hp; state.enemyMaxHp = lv.hp;
  state.playerHp = PLAYER_HP;
  state.combo = 0;
  state.ignoreNextSpace = false;
  state.shield = lv.boss;
  state.queue = shuffled(POOLS[state.tier][i]);
  state.totalSentences = 0; state.perfectSentences = 0;
  state.correctChars = 0; state.mistakeKeys = 0; state.wpmSum = 0; state.wpmCount = 0;
  nextSentence();
  state.screen = "fight";
  render();
}
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function nextSentence(){
  if(state.queue.length === 0) state.queue = shuffled(POOLS[state.tier][state.levelIdx]);
  state.current = state.queue.pop();
  state.typed = ""; state.mistakesThisSentence = 0; state.consecWrong = 0;
  state.sentenceStart = 0;
}

function onType(ch){
  if(state.screen !== "fight") return;
  // Many people naturally tap Space after finishing a sentence. Ignore that one
  // separator before the next prompt, without starting its timer or adding a mistake.
  if(state.ignoreNextSpace){
    state.ignoreNextSpace = false;
    if(ch === " ") return;
  }
  const target = state.current;
  if(!state.sentenceStart) state.sentenceStart = Date.now();
  resetIdle();

  if(ch === "Backspace"){
    if(state.typed.length > 0){
      state.typed = state.typed.slice(0,-1);
      state.correctChars = Math.max(0, state.correctChars - 1);
      state.run.correctChars = Math.max(0, state.run.correctChars - 1);
      setCursor("targetBox", target, state.typed.length);
    }
    updateFightStats();
    return;
  }
  if(ch.length !== 1) return;
  if(!state.fightStartedAt) state.fightStartedAt = Date.now();

  const idx = state.typed.length;
  if(idx >= target.length) return;
  if(ch === target[idx]){
    state.typed += ch; state.consecWrong = 0;
    state.correctChars++; state.run.correctChars++;
    setCursor("targetBox", target, state.typed.length);
    popJust("targetBox", state.typed.length);
    sndKey();
  } else {
    state.mistakesThisSentence++; state.consecWrong++;
    state.mistakeKeys++; state.run.mistakeKeys++;
    flashBad("targetBox", idx);
    sndBad();
    popText("miss", false, "me");
    updateFightStats();
    if(state.consecWrong >= MISTAKE_LIMIT) enemyCounters();
    return;
  }
  updateFightStats();
  if(state.typed.length === target.length){
    finishSentence();
    if(state.screen !== "fight") return;
    state.ignoreNextSpace = true;
    buildSpanBox("targetBox", state.current);
    updateFightStats();
  }
}

function chooseCombatMove(critical,wpm,wpmGoal){
  if(critical) return {key:"finisher",label:"PERFECT FINISHER"};
  if(wpm >= wpmGoal*1.18) return {key:"rush",label:"SPEED RUSH"};
  if(state.combo >= 3 && state.attackCount % 3 === 2) return {key:"spin",label:"COMBO SPIN"};
  const sequence=[
    {key:"jab",label:"QUICK STRIKE"},
    {key:"cross",label:"CROSS HIT"},
    {key:"sweep",label:"LOW SWEEP"},
    {key:"uppercut",label:"RISING UPPERCUT"},
    {key:"heavy",label:"POWER BLOW"},
    {key:"double",label:"DOUBLE STRIKE"},
    {key:"dash",label:"DASH ATTACK"}
  ];
  return sequence[state.attackCount % sequence.length];
}
function finishSentence(){
  const lv = fighterAt(state.levelIdx);
  const ms = Date.now() - state.sentenceStart;
  const wpm = wpmOf(state.current, ms);
  const {dmg, perfect, crit} = calcDamage({
    sentence: state.current, mistakes: state.mistakesThisSentence, wpm, wpmGoal: lv.wpmGoal, combo: state.combo
  });
  state.totalSentences++; state.run.sentences++;
  state.wpmSum += wpm; state.wpmCount++; state.run.wpmSum += wpm; state.run.wpmCount++;
  state.bestSentenceWpm = Math.max(state.bestSentenceWpm, wpm);
  state.run.bestWpm = Math.max(state.run.bestWpm || 0, wpm);

  if(perfect){
    state.perfectSentences++; state.run.perfect++;
    const before = state.combo;
    state.combo = Math.min(state.combo+1, state.comboMax);
    if(state.combo > before){
      popText("COMBO x"+(1+state.combo*0.25).toFixed(2), false, "me");
      if(state.combo >= 2) pulseCombo();
    }
  } else state.combo = 0;

  if(state.shield){
    if(perfect){ state.shield = false; popText("SHIELD BROKEN", true, "en"); animatePlayerStrike("finisher",true); sndHit(true); }
    else {
      popText("shield holds", false, "en");
      enemyCounters();
      if(state.screen !== "fight") return;
      refreshBars(); nextSentence(); return;
    }
  } else {
    const finalDamage=dmg;
    state.enemyHp = Math.max(0, state.enemyHp - finalDamage);
    state.run.damageDealt += finalDamage;
    state.levelDamageDealt += finalDamage;
    const move = chooseCombatMove(crit || finalDamage>dmg,wpm,lv.wpmGoal);
    state.attackCount++;
    popText(move.label+" · -"+finalDamage, crit || finalDamage>dmg, "en");
    animatePlayerStrike(finalDamage>dmg?"finisher":move.key,crit || finalDamage>dmg); sndHit(crit || finalDamage>dmg);
  }

  if(!perfect){
    enemyCounters();
    if(state.screen !== "fight") return;
  }
  refreshBars();
  if(state.enemyHp <= 0){ defeatEnemy(); return; }
  nextSentence();
}

function enemyCounters(){
  const lv = fighterAt(state.levelIdx);
  const counterIndex = state.enemyCounterCount++;
  // Each opponent has a different readable counter pattern; the final boss adds slams.
  const counterPatterns = [
    ["quick","lunge","uppercut","quick"],
    ["lunge","double","quick","heavy"],
    ["uppercut","heavy","lunge","double"],
    ["double","heavy","uppercut","lunge"],
    ["quick","double","heavy","slam"]
  ];
  const pattern = counterPatterns[Math.min(state.levelIdx,counterPatterns.length-1)];
  const counterMove = pattern[counterIndex % pattern.length];
  const counterLabels = {quick:"QUICK COUNTER",lunge:"DASH COUNTER",uppercut:"UPPERCUT COUNTER",double:"DOUBLE COUNTER",heavy:"POWER COUNTER",slam:"GROUND SLAM"};
  const incomingDamage=lv.atk;
  state.playerHp = Math.max(0, state.playerHp - incomingDamage);
  popText(counterLabels[counterMove]+" · -"+incomingDamage, counterMove==="heavy" || counterMove==="slam", "me");
  animateEnemyStrike(counterMove);
  if(state.playerHp <= 0){ stopFightStatsLoop(); recordFightProfileResult(false); state.screen = "lose"; sndLose(); render(); return; }
  refreshBars();
}
function addFlinch(who){
  const el = document.getElementById("stick-"+who);
  if(!el) return;
  el.classList.remove("flinch"); void el.offsetWidth; el.classList.add("flinch");
  setTimeout(()=>el && el.classList.remove("flinch"), 420);
}
function stageClassPulse(id, className, duration=460){
  const el = document.getElementById(id);
  if(!el) return;
  // A fighter can only perform one primary move at a time. Remove older move
  // classes first so a fast follow-up uses its own animation instead of inheriting one.
  const exclusivePrefix = className.startsWith("move-") ? "move-" : (className.startsWith("counter-") ? "counter-" : null);
  if(exclusivePrefix){
    [...el.classList].filter(name=>name.startsWith(exclusivePrefix)).forEach(name=>el.classList.remove(name));
  }
  el.classList.remove(className); void el.offsetWidth; el.classList.add(className);
  setTimeout(()=>el && el.classList.remove(className), duration);
}
function spawnHitSparks(host, critical=false){
  const stage = document.getElementById("stage-"+host);
  if(!stage) return;
  const count = critical ? 12 : 7;
  for(let i=0;i<count;i++){
    const spark = document.createElement("span");
    const angle = (Math.PI*2*i)/count + (Math.random()*.22);
    const distance = (critical ? 48 : 34) + Math.random()*24;
    spark.className = "combat-spark";
    spark.style.setProperty("--dx", Math.cos(angle)*distance + "px");
    spark.style.setProperty("--dy", Math.sin(angle)*distance + "px");
    spark.style.setProperty("--rot", (angle*180/Math.PI) + "deg");
    spark.style.setProperty("--spark-color", critical ? "var(--crit)" : (host === "enemy" ? "var(--e)" : "var(--p)"));
    stage.appendChild(spark);
    setTimeout(()=>spark.remove(), 460);
  }
}
function animatePlayerStrike(move="jab",critical=false){
  if(typeof move === "boolean"){critical=move;move=critical?"finisher":"jab";}
  const moveDuration = move==="finisher"?660:(move==="spin" || move==="double" ? 600 : 540);
  stageClassPulse("stage-me", "move-"+move, moveDuration);
  stageClassPulse("stage-enemy", "impact-hit", 450);
  if(move==="heavy" || move==="finisher") stageClassPulse("stage-enemy", "impact-heavy", 560);
  if(move==="sweep") stageClassPulse("stage-enemy", "impact-sweep", 500);
  if(move==="uppercut") stageClassPulse("stage-enemy", "impact-uppercut", 560);
  if(move==="spin") stageClassPulse("stage-enemy", "impact-spin", 620);
  if(move==="double") stageClassPulse("stage-enemy", "impact-double", 580);
  if(move==="dash" || move==="rush") stageClassPulse("stage-enemy", "impact-dash", 520);
  if(critical) stageClassPulse("stage-enemy", "critical-impact", 620);
  addFlinch("enemy");
  spawnBurst("enemy");
  spawnHitSparks("enemy", critical || move==="heavy" || move==="finisher" || move==="spin");
  if(move==="rush" || move==="finisher" || move==="spin") pulseCombo();
}
function animateEnemyStrike(move="quick"){
  const clsByMove = {quick:"counter-quick",lunge:"counter-lunge",uppercut:"counter-uppercut",double:"counter-double",heavy:"counter-heavy",slam:"counter-slam"};
  const cls = clsByMove[move] || "counter-quick";
  const duration = move==="heavy" || move==="slam" ? 600 : (move==="double" ? 560 : 470);
  stageClassPulse("stage-enemy", cls, duration);
  stageClassPulse("stage-me", "impact-hit", 450);
  stageClassPulse("stage-me", "player-impact", 450);
  if(move==="heavy" || move==="slam") stageClassPulse("stage-me", "impact-heavy", 580);
  if(move==="uppercut") stageClassPulse("stage-me", "impact-uppercut", 560);
  if(move==="double") stageClassPulse("stage-me", "impact-double", 560);
  addFlinch("me");
  spawnBurst("me");
  spawnHitSparks("me", move==="heavy" || move==="slam" || move==="double");
}
function pulseCombo(){
  const arena = document.querySelector(".arena");
  if(!arena) return;
  arena.classList.remove("combo-surge"); void arena.offsetWidth; arena.classList.add("combo-surge");
  setTimeout(()=>arena && arena.classList.remove("combo-surge"), 440);
}
function applyBruises(who, hp, max){
  const el = document.getElementById("stick-"+who);
  if(!el) return;
  el.classList.remove("dmg-mid","dmg-low","dmg-crit");
  const pct = hp / max;
  if(pct <= 0.25) el.classList.add("dmg-crit");
  else if(pct <= 0.5) el.classList.add("dmg-low");
  else if(pct <= 0.75) el.classList.add("dmg-mid");
}
function spawnBurst(host){
  const stage = document.getElementById("stage-"+host);
  if(!stage) return;
  const b = document.createElement("div");
  b.className = "burst " + host;
  stage.appendChild(b);
  setTimeout(()=>b.remove(), 460);
}
function refreshBars(){
  const lv = fighterAt(state.levelIdx);
  const hpMe = document.getElementById("hpMe"); if(hpMe) hpMe.style.width = (state.playerHp/PLAYER_HP*100)+"%";
  const hpEn = document.getElementById("hpEn"); if(hpEn) hpEn.style.width = (state.enemyHp/state.enemyMaxHp*100)+"%";
  const shieldTag = document.getElementById("shieldTag"); if(shieldTag) shieldTag.style.display = state.shield ? "inline-flex" : "none";
  const shieldVisual = document.getElementById("bossShieldVisual"); if(shieldVisual) shieldVisual.style.display = state.shield ? "block" : "none";
  const hud = document.getElementById("hudBox"); if(hud) hud.innerHTML = hudHTML(lv);
  applyBruises("me", state.playerHp, PLAYER_HP);
  applyBruises("enemy", state.enemyHp, state.enemyMaxHp);
  updateFightStats();
}

function spawnDefeatEffect(){
  const stage = document.getElementById("stage-enemy");
  const arena = document.querySelector(".arena");
  if(!stage) return;
  stage.classList.add("enemy-defeat");
  if(arena){ arena.classList.remove("ko-shake"); void arena.offsetWidth; arena.classList.add("ko-shake"); }
  const rings = [];
  for(let r=0;r<2;r++){
    const ring = document.createElement("div");
    ring.className = "defeat-ring";
    ring.style.animationDelay = (r*.12)+"s";
    ring.style.width = (r===0?32:22)+"px";
    ring.style.height = (r===0?32:22)+"px";
    stage.appendChild(ring); rings.push(ring);
  }
  for(let i=0;i<22;i++){
    const particle = document.createElement("div");
    const angle = (Math.PI * 2 * i) / 22;
    const distance = 58 + (i % 5) * 17;
    particle.className = "defeat-particle";
    particle.style.width = (i%3===0?12:7)+"px";
    particle.style.height = (i%3===0?12:7)+"px";
    particle.style.background = i%4===0 ? "var(--crit)" : "var(--e)";
    particle.style.setProperty("--dx", Math.cos(angle) * distance + "px");
    particle.style.setProperty("--dy", Math.sin(angle) * distance + "px");
    particle.style.setProperty("--rot", (i * 47) + "deg");
    stage.appendChild(particle);
    setTimeout(()=>particle.remove(), 900);
  }
  rings.forEach(ring=>setTimeout(()=>ring.remove(), 900));
  if(arena) setTimeout(()=>arena.classList.remove("ko-shake"), 460);
}
function defeatEnemy(){
  if(state.screen !== "fight") return;
  clearTimeout(state.idleTimer);
  state.idleTimer = null;
  stopFightStatsLoop();
  state.screen = "defeating";
  popText("K.O.!", true, "en");
  spawnDefeatEffect();
  clearTimeout(state.defeatTimer);
  state.defeatTimer = setTimeout(()=>{
    state.defeatTimer = null;
    winLevel();
  }, 880);
}
function winLevel(){
  clearTimeout(state.idleTimer);
  stopFightStatsLoop();
  recordFightProfileResult(true);
  state.screen = "win";
  sndWin();
  render();
}
function pauseGame(){
  if(state.screen !== "fight") return;
  clearTimeout(state.idleTimer);
  state.idleTimer = null;
  state.pauseStartedAt = Date.now();
  state.fightPausedAt = Date.now();
  stopFightStatsLoop();
  state.screen = "pause";
  render();
}
function resumeGame(){
  if(state.screen !== "pause") return;
  if(state.pauseStartedAt && state.sentenceStart){
    state.sentenceStart += Date.now() - state.pauseStartedAt;
  }
  if(state.fightPausedAt && state.fightStartedAt){ state.fightPausedTotal += Date.now() - state.fightPausedAt; }
  state.fightPausedAt = 0;
  state.pauseStartedAt = 0;
  state.screen = "fight";
  render();
}
function leavePausedGame(){
  if(state.screen !== "pause") return;
  stopFightStatsLoop();
  state.fightPausedAt = 0;
  state.pauseStartedAt = 0;
  state.ignoreNextSpace = false;
  state.screen = "start";
  render();
}
function fightElapsedMs(){
  if(!state.fightStartedAt) return 0;
  const end = state.fightPausedAt || Date.now();
  return Math.max(0, end - state.fightStartedAt - state.fightPausedTotal);
}
function updateFightStats(){
  const wpmEl = document.getElementById("fightWpm");
  if(!wpmEl) return;
  const elapsed = fightElapsedMs();
  const wpm = elapsed > 0 ? Math.round((state.correctChars/5) / (Math.max(elapsed, 5000)/60000)) : 0;
  const attempts = state.correctChars + state.mistakeKeys;
  const accuracy = attempts ? Math.round(state.correctChars/attempts*100) : 100;
  const values = {
    fightWpm:wpm,
    fightAccuracy:accuracy+"%",
    fightCombo:"x"+(1+Math.min(state.combo,4)*.25).toFixed(2),
    fightDamage:state.levelDamageDealt
  };
  Object.entries(values).forEach(([id,value])=>{ const el=document.getElementById(id); if(el) el.textContent=value; });
  const sentenceFill = document.getElementById("sentenceProgressFill");
  const sentenceCount = document.getElementById("sentenceProgressCount");
  const sentencePct = state.current.length ? Math.round(state.typed.length/state.current.length*100) : 0;
  if(sentenceFill) sentenceFill.style.width = sentencePct+"%";
  if(sentenceCount) sentenceCount.textContent = state.typed.length+" / "+state.current.length+" chars";
  const campaignFill = document.getElementById("campaignProgressFill");
  const campaignCount = document.getElementById("campaignProgressCount");
  const enemyProgress = state.enemyMaxHp ? 1-(state.enemyHp/state.enemyMaxHp) : 0;
  const campaignPct = ((state.levelIdx + enemyProgress)/FIGHTERS.length)*100;
  if(campaignFill) campaignFill.style.width = Math.max(0,Math.min(100,campaignPct))+"%";
  if(campaignCount) campaignCount.textContent = "FIGHTER "+String(state.levelIdx+1).padStart(2,"0")+" / 0"+FIGHTERS.length;
}
function startFightStatsLoop(){
  stopFightStatsLoop();
  updateFightStats();
  state.statsTimer = setInterval(()=>{
    if(state.screen === "fight") updateFightStats();
    else stopFightStatsLoop();
  },500);
}
function stopFightStatsLoop(){
  clearInterval(state.statsTimer);
  state.statsTimer = null;
}

function resetIdle(){ clearTimeout(state.idleTimer); scheduleIdleCheck(); }
function scheduleIdleCheck(){
  clearTimeout(state.idleTimer);
  state.idleTimer = setTimeout(()=>{ if(state.screen==="fight") enemyCounters(); }, IDLE_LIMIT_MS);
}

let popMeEl=null, popEnEl=null;

  const hostEl = host === "me" ? popMeEl : popEnEl;
  if(!hostEl) return;
  const d = document.createElement("div");
  d.className = "pop" + (big ? " crit" : "");
  d.textContent = text;

}

function goHomeFromLogo(){
  // Leave any active mode cleanly: no idle attacks, countdowns, or stale defeat callbacks.
  clearTimeout(state.idleTimer);
  state.idleTimer = null;
  stopFightStatsLoop();
  clearTimeout(state.defeatTimer);
  state.defeatTimer = null;
  if(endlessState && endlessState.timerId){
    clearInterval(endlessState.timerId);
    endlessState.timerId=null;
    endlessState.active=false;
    endlessState.paused=false;
  }
  if(speedState){
    clearInterval(speedState.timerId);
    speedState.timerId = null;
    speedState.active = false;
    speedState.paused = false;
    speedState = null;
  }
  state.pauseStartedAt = 0;
  state.ignoreNextSpace = false;
  state.screen = "start";
  render();
  window.scrollTo({top:0,left:0,behavior:"auto"});
}

}

function durationLabel(seconds){

  return s+" seconds";
}

function startSpeedTest(seconds){
  const durationSeconds=Math.max(30,Math.min(900,Math.round(Number(seconds||60)/30)*30));
  speedState={
    active:true,paused:false,pauseStartedAt:0,startTime:null,durationMs:durationSeconds*1000,durationSeconds,
    minutes:durationSeconds/60,durationLabel:durationLabel(durationSeconds),isCustom:![60,180].includes(durationSeconds),
    text:genSpeedPassage(Math.ceil(durationSeconds*3.4)),
    typedLen:0,correctChars:0,mistakeKeys:0,timerId:null,result:null
  };
  state.screen="speedtest";render();
}
function renderSpeedTest(){
  const elapsed = speedState.startTime === null ? 0 : Date.now() - speedState.startTime;
  const remaining = Math.max(0, speedState.durationMs - elapsed);
  app.innerHTML =
  "<section class='screen speed-screen'>"+
  "<div class='speed-test-toolbar'>"+
    "<h1>Speed <span>Test</span></h1>"+
    "<div class='lvl' id='speedTimer' style='font-size:1.1rem;padding:10px 20px'>"+fmtTime(remaining)+"</div>"+
    "<button class='pause-btn' id='speedPauseBtn' type='button' aria-label='Pause timed test'>Ⅱ &nbsp; Pause</button>"+
  "</div>"+
  "<div class='speed-viewport' id='speedViewport' aria-label='Typing text; this area scrolls as you type'>"+
    "<div class='target speed-target' id='speedBox' tabindex='0'></div>"+
  "</div>"+
  "<p class='hint'>The timer starts with your first keystroke. Press Esc to pause.</p>"+
  "<input id='speedTypebox' autocomplete='off' autocapitalize='off' spellcheck='false' aria-label='Type the displayed text'>"+
  "</section>";
  buildSpanBox("speedBox", speedState.text);
  setCursor("speedBox", speedState.text, speedState.typedLen);
  const viewport = document.getElementById("speedViewport");
  if(viewport && speedState.typedLen === 0) viewport.scrollTop = 0;
  // Preserve the reading position when resuming from the pause menu.
  if(speedState.typedLen > 0) keepSpeedCursorVisible();
  else window.scrollTo(0, 0);
  const typebox = document.getElementById("speedTypebox");
  typebox.focus({preventScroll:true});
  document.getElementById("speedBox").addEventListener("click", ()=>typebox.focus({preventScroll:true}));
  document.getElementById("speedPauseBtn").addEventListener("click", pauseSpeedTest);
  bindSpeedTyping();
}
function keepSpeedCursorVisible(){
  const viewport = document.getElementById("speedViewport");
  const box = document.getElementById("speedBox");
  if(!viewport || !box || !speedState) return;
  const cursor = box.children[speedState.typedLen];
  if(!cursor) return;
  const viewRect = viewport.getBoundingClientRect();
  const cursorRect = cursor.getBoundingClientRect();
  const topPadding = 28;
  const bottomPadding = 54;
  if(cursorRect.top < viewRect.top + topPadding){
    viewport.scrollTop -= (viewRect.top + topPadding - cursorRect.top);
  } else if(cursorRect.bottom > viewRect.bottom - bottomPadding){
    viewport.scrollTop += (cursorRect.bottom - (viewRect.bottom - bottomPadding));
  }
}
function bindSpeedTyping(){
  const box = document.getElementById("speedTypebox");
  box.value = "";
  box.addEventListener("keydown", e=>{
    if(e.key === "Backspace"){ speedOnType("Backspace"); e.preventDefault(); return; }
    if(e.key.length === 1 && !e.ctrlKey && !e.metaKey){ speedOnType(e.key); }
  });
}
function speedOnType(ch){
  if(!speedState || !speedState.active) return;
  if(ch === "Backspace"){
    if(speedState.typedLen > 0){
      speedState.typedLen--;
      speedState.correctChars = Math.max(0, speedState.correctChars - 1);
      setCursor("speedBox", speedState.text, speedState.typedLen);
      keepSpeedCursorVisible();
    }
    return;
  }
  if(ch.length !== 1) return;
  if(speedState.startTime === null){ speedState.startTime = Date.now(); startSpeedTimerLoop(); }
  const idx = speedState.typedLen;
  if(idx >= speedState.text.length) return;
  if(ch === speedState.text[idx]){
    speedState.typedLen++; speedState.correctChars++;
    setCursor("speedBox", speedState.text, speedState.typedLen);
    popJust("speedBox", speedState.typedLen);
    keepSpeedCursorVisible();
    sndKey();
  } else {
    speedState.mistakeKeys++;
    flashBad("speedBox", idx);
    sndBad();
  }
}
function pauseSpeedTest(){
  if(state.screen !== "speedtest" || !speedState || !speedState.active) return;
  speedState.active = false;
  speedState.paused = true;
  speedState.pauseStartedAt = Date.now();
  clearInterval(speedState.timerId);
  speedState.timerId = null;
  state.screen = "speedpause";
  render();
}
function resumeSpeedTest(){
  if(state.screen !== "speedpause" || !speedState || !speedState.paused) return;
  const pausedFor = Date.now() - speedState.pauseStartedAt;
  if(speedState.startTime !== null) speedState.startTime += pausedFor;
  speedState.pauseStartedAt = 0;
  speedState.paused = false;
  speedState.active = true;
  state.screen = "speedtest";
  render();
  if(speedState.startTime !== null) startSpeedTimerLoop();
}
function exitPausedSpeedTest(){
  if(state.screen !== "speedpause") return;
  if(speedState){ clearInterval(speedState.timerId); speedState.timerId = null; }
  speedState = null;
  state.screen = "speedmenu";
  render();
}
function renderSpeedPauseMenu(){
  const elapsedAtPause = speedState.startTime === null ? 0 : speedState.pauseStartedAt - speedState.startTime;
  const remaining = Math.max(0, speedState.durationMs - elapsedAtPause);
  app.innerHTML =
  "<section class='screen speed-pause-screen'>"+
    "<div class='speed-pause-card'>"+
      "<div class='pause-mark'>Ⅱ</div>"+
      "<h1>Test <span>Paused</span></h1>"+
      "<p class='sub' style='margin:8px auto 0'>Your passage and progress are saved. The timer is stopped.</p>"+
      "<div class='speed-pause-meta'>"+speedState.durationLabel+" test &nbsp; · &nbsp; "+fmtTime(remaining)+" remaining</div>"+
      "<div class='pause-actions'><button class='btn' id='resumeSpeedBtn'>Resume Test</button><button class='btn ghost' id='exitSpeedBtn'>Back to Speed Menu</button></div>"+
      "<p class='hint'>Press Esc to resume.</p>"+
    "</div>"+
  "</section>";
  document.getElementById("resumeSpeedBtn").addEventListener("click", resumeSpeedTest);
  document.getElementById("exitSpeedBtn").addEventListener("click", exitPausedSpeedTest);
}

function startSpeedTimerLoop(){
  speedState.timerId = setInterval(()=>{
    if(!speedState || !speedState.active) return;
    const remain = speedState.durationMs - (Date.now() - speedState.startTime);
    if(remain <= 0){ finishSpeedTest(); return; }
    const el = document.getElementById("speedTimer"); if(el) el.textContent = fmtTime(remain);
  }, 250);
}
function fmtTime(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function finishSpeedTest(){
  if(!speedState || !speedState.active) return;
  speedState.active = false;
  clearInterval(speedState.timerId);
  const minutes = speedState.durationMs / 60000;
  const wpm = Math.round((speedState.correctChars/5) / minutes);
  const total = speedState.correctChars + speedState.mistakeKeys;
  const accuracy = total > 0 ? Math.round(speedState.correctChars/total*100) : 100;
  speedState.result = {wpm, accuracy};
  profile.stats.speedTests++;
  profile.stats.longestSpeedTestSeconds=Math.max(profile.stats.longestSpeedTestSeconds||0,speedState.durationSeconds);
  if(speedState.isCustom) profile.stats.customSpeedTests++;
  profile.stats.bestSpeedWpm = Math.max(profile.stats.bestSpeedWpm,wpm);
  profile.stats.bestSpeedAccuracy = Math.max(profile.stats.bestSpeedAccuracy||0,accuracy);
  addProfileActivity({mode:"Speed test",label:speedState.durationLabel+" test",wpm,accuracy,correctChars:speedState.correctChars,mistakes:speedState.mistakeKeys,durationMs:speedState.durationMs});
  const xpEarned=Math.min(180,Math.max(8,Math.round(speedState.durationSeconds/30*6+Math.min(wpm,120)*.12)));
  awardXP(xpEarned,"Speed test");
  state.screen = "speedresult"; render();
}

  const {wpm, accuracy} = speedState.result;
  app.innerHTML =
  "<section class='screen center'>"+

  "<p class='sub'>"+esc(speedState.durationLabel)+" test, done.</p>"+xpAwardHTML()+
  "<div class='result'>"+
    "<div class='row'><span>Words per minute</span><b>"+wpm+"</b></div>"+
    "<div class='row score'><span>Accuracy</span><b>"+accuracy+"%</b></div>"+

  "</section>";
  document.getElementById("againSB").addEventListener("click", ()=>startSpeedTest(speedState.durationSeconds));
  document.getElementById("homeSB").addEventListener("click", ()=>{state.screen="start";render();});
}

function endlessWave(){ return Math.floor((endlessState?.enemiesDefeated||0)/5)+1; }

function endlessBossDue(){ return endlessState && endlessState.enemiesDefeated>=endlessState.nextBossAt && !endlessState.bossActive; }
function chooseEndlessBossWord(){
  const pool=ENDLESS_WORDS.filter(w=>w.length>=10 && w.length<=15);

  let options=pool.filter(w=>!used.includes(w));

  endlessState.bossWordHistory.push(word);

}

// Easy keeps the original relaxed one-at-a-time flow. Hard uses a separate,
// predictable spawn schedule so pressure comes from a manageable queue of targets.
function endlessTravelMs(){
  const wave=endlessWave();
  if(endlessIsHard()) return Math.max(15500,17800-(wave-1)*200);
  return Math.max(14500,23800-(wave-1)*620);
}
function endlessSpawnMs(){
  const wave=endlessWave();
  if(endlessIsHard()) return Math.max(2900,3600-(wave-1)*70);
  return Math.max(6500,10000-(wave-1)*320);
}
function endlessMaxEnemies(){
  const wave=endlessWave();
  if(endlessIsHard()) return Math.min(6,4+Math.floor(Math.max(0,wave-1)/5));
  return Math.min(6,3+Math.floor(Math.max(0,wave-1)/4));
}
function shuffleEndless(list){const out=list.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function chooseEndlessWord(){
  const wave=endlessWave();
  let min,max;
  if(endlessIsHard()){
    // A short warm-up, then a steady shift toward longer words from wave to wave.
    if(wave<3){min=4;max=7;}
    else if(wave<6){min=5;max=8;}
    else if(wave<11){min=6;max=10;}
    else {min=7;max=12;}
  }else{
    min=wave<3?3:wave<6?4:wave<11?5:6;
    max=wave<3?6:wave<6?8:wave<11?10:12;
  }
  const eligible=ENDLESS_WORDS.filter(w=>w.length>=min && w.length<=max);
  if(!endlessState.wordBag || !endlessState.wordBag.length || !endlessState.wordBag.some(w=>eligible.includes(w))) endlessState.wordBag=shuffleEndless(eligible);
  const idx=endlessState.wordBag.findIndex(w=>eligible.includes(w));
  if(idx<0){endlessState.wordBag=shuffleEndless(eligible);return endlessState.wordBag.pop()||"signal";}
  return endlessState.wordBag.splice(idx,1)[0];
}
function chooseEndlessType(){
  let bag=endlessState.typeBag;
  if(!bag || !bag.length){bag=shuffleEndless(ENDLESS_ENEMY_TYPES);endlessState.typeBag=bag;}
  return endlessState.typeBag.pop();
}
function chooseEndlessLane(){
  const wave=endlessWave();
  const lanes=endlessIsHard()?(wave<3?[12,28,42,58,72,88]:wave<7?[8,22,36,50,64,78,92]:[6,19,32,44,56,68,81,94]):(wave<2?[30,50,70]:wave<5?[16,32,50,68,84]:[12,26,40,50,60,74,88]);
  const occupied=new Set(endlessState.enemies.filter(e=>!e.destroyed).map(e=>e.lane));
  const recent=endlessState.recentLanes||[];
  let choices=lanes.filter(l=>!occupied.has(l) && !recent.slice(-2).includes(l));
  if(!choices.length) choices=lanes.filter(l=>!occupied.has(l));
  if(!choices.length) choices=lanes.slice();
  if((wave>=3 || endlessIsHard()) && Math.random()<(endlessIsHard()?.58:.68)){
    const outer=choices.filter(l=>l<=32||l>=68);
    if(outer.length) choices=outer;
  }
  const lane=choices[Math.floor(Math.random()*choices.length)];
  endlessState.lastLane=lane;
  endlessState.recentLanes=recent.concat(lane).slice(-4);
  return lane;
}
function spawnEndlessEnemy(isBossMinion=false){
  if(!endlessState || endlessState.enemies.length>=endlessMaxEnemies()) return;
  const type=chooseEndlessType();
  const enemy={id:endlessState.nextId++,word:chooseEndlessWord(),spawnAt:Date.now(),travelMs:Math.round(endlessTravelMs()*(isBossMinion?type.travel*.9:type.travel)),lane:chooseEndlessLane(),typeKey:type.key,typeLabel:isBossMinion?"RIFT MINION":type.label,glyph:type.glyph,points:type.points,destroyed:false,isBossMinion};
  endlessState.enemies.push(enemy);
  if(!endlessState.currentTargetId) endlessState.currentTargetId=enemy.id;
  endlessState.lastSpawnAt=Date.now();
  renderEndlessField();
}

function endlessElapsedMs(now=Date.now()){
  if(!endlessState) return 0;
  const end=endlessState.paused && endlessState.pausedAt ? endlessState.pausedAt : now;
  return Math.max(0,end-endlessState.startedAt-endlessState.pausedTotal);
}
function endlessWpm(){
  const mins=Math.max(endlessElapsedMs()/60000,0.05);
  return Math.round((endlessState.correctChars/5)/mins);
}
function endlessAccuracy(){
  const total=endlessState.correctChars+endlessState.mistakes;
  return total?Math.round(endlessState.correctChars/total*100):100;
}
function getEndlessTarget(){
  if(!endlessState || !endlessState.enemies.length) return null;
  const locked=endlessState.enemies.find(e=>e.id===endlessState.currentTargetId && !e.destroyed);
  if(locked) return locked;
  const next=endlessState.enemies.filter(e=>!e.destroyed).sort((a,b)=>(b.isBoss-a.isBoss)||(a.spawnAt-b.spawnAt))[0] || null;
  endlessState.currentTargetId=next ? next.id : null;
  return next;
}

function renderEndlessField(){
  const field=document.getElementById("endlessField");
  if(!field || !endlessState) return;
  const now=Date.now();
  const target=getEndlessTarget();
  const existing=new Map(Array.from(field.querySelectorAll(".endless-enemy"),node=>[Number(node.dataset.enemy),node]));
  const keep=new Set();
  endlessState.enemies.forEach(enemy=>{
    let card=existing.get(enemy.id);
    if(!card){
      card=document.createElement("div");
      card.dataset.enemy=String(enemy.id);
      card.innerHTML="<div class='enemy-archetype'><span class='enemy-glyph'></span><small class='enemy-type'></small></div><strong></strong><small class='enemy-state'></small>";
      field.appendChild(card);
    }
    keep.add(enemy.id);
    card.classList.add("endless-enemy","type-"+enemy.typeKey);
    card.classList.toggle("is-boss",!!enemy.isBoss);
    card.classList.toggle("boss-shielded",!!enemy.isBoss&&enemy.bossPhase===1);
    card.classList.toggle("is-target",!!(target && target.id===enemy.id));
    if(enemy.destroyed) card.classList.add("is-destroyed");
    else if(!card.classList.contains("laser-hit")) card.classList.remove("is-destroyed");
    const progress=Math.max(0,Math.min(1,(now-enemy.spawnAt)/enemy.travelMs));

    const top=13+progress*75;
    card.style.left=enemy.lane+"%";
    card.style.top=top+"%";
    card.style.transform="translate(-50%,-50%) scale("+scale+")";
    card.style.opacity=String(.68+progress*.32);
    card.style.zIndex=String(2+Math.round(progress*14));

    const label=card.querySelector(".enemy-type");if(label)label.textContent=enemy.isBoss?enemy.typeLabel+" · "+enemy.bossPhase+"/2":enemy.typeLabel;

  });
