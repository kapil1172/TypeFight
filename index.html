function endlessTick(){
  if(!endlessState || !endlessState.active || state.screen!=="endless") return;
  const now=Date.now();
  if(endlessBossDue() && endlessState.enemies.length<endlessMaxEnemies()) spawnEndlessBoss();
  if(now-endlessState.lastSpawnAt>=endlessSpawnMs() && endlessState.enemies.length<endlessMaxEnemies()) spawnEndlessEnemy();
  let escaped=0;
  const activeBeforeEscape=endlessState.currentTargetId;
  const escapedIds=[];
  endlessState.enemies=endlessState.enemies.filter(enemy=>{
    if(enemy.destroyed) return now-(enemy.destroyedAt||now)<430;
    if(now-enemy.spawnAt>=enemy.travelMs){escaped++;escapedIds.push(enemy.id);return false;}
    return true;
  });
  if(escaped){
    // A cluster of enemies crossing the horizon together counts as one breach,
    // not multiple hearts lost in a single frame. This avoids unfair instant knockouts.
    endlessState.combo=0;
    const damageReady=!endlessState.lastLifeLossAt || now-endlessState.lastLifeLossAt>=1100;
    if(damageReady){
      endlessState.lives=Math.max(0,endlessState.lives-1);
      endlessState.lastLifeLossAt=now;
      const tunnel=document.getElementById("endlessTunnel");if(tunnel){tunnel.classList.remove("tunnel-hit");void tunnel.offsetWidth;tunnel.classList.add("tunnel-hit");}
      const appRoot=document.getElementById("app");if(appRoot){appRoot.classList.remove("endless-life-lost");void appRoot.offsetWidth;appRoot.classList.add("endless-life-lost");}
    }
    if(escapedIds.includes(activeBeforeEscape)){
      endlessState.currentTargetId=null;
      endlessState.typed="";
      getEndlessTarget();
    }
    if(endlessState.lives<=0){updateEndlessHud();endEndlessGame();return;}
  }
  renderEndlessField();
  updateEndlessHud();
  updateEndlessPrompt();
}
function bindEndlessTyping(){
  const input=document.getElementById("endlessTypebox");
  input.addEventListener("keydown",e=>{
    if(e.key==="Backspace"){endlessOnType("Backspace");e.preventDefault();return;}
    if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){endlessOnType(e.key);e.preventDefault();}
  });
}
function endlessOnType(ch){
  if(!endlessState || !endlessState.active || state.screen!=="endless") return;
  if(endlessState.ignoreSpace){endlessState.ignoreSpace=false;if(ch===" ")return;}
  const target=getEndlessTarget();
  if(!target) return;
  if(ch==="Backspace"){
    if(endlessState.typed.length){endlessState.typed=endlessState.typed.slice(0,-1);endlessState.correctChars=Math.max(0,endlessState.correctChars-1);updateEndlessPrompt();updateEndlessHud();}
    return;
  }
  if(ch.length!==1)return;
  const next=target.word[endlessState.typed.length];
  if(ch===next){
    endlessState.typed+=ch;endlessState.correctChars++;sndKey();
    updateEndlessPrompt();updateEndlessHud();
    if(endlessState.typed.length===target.word.length){
      if(target.isBoss && target.bossPhase===1){
        target.bossPhase=2;target.word=chooseEndlessBossWord();endlessState.typed="";
        const card=document.querySelector("[data-enemy='"+target.id+"']");if(card){card.classList.remove("boss-shielded");card.classList.add("boss-core-exposed");}
        const tunnel=document.getElementById("endlessTunnel");if(tunnel){tunnel.classList.remove("boss-break");void tunnel.offsetWidth;tunnel.classList.add("boss-break");}
        popEndlessPoints("SHIELD BROKEN");sndHit(true);updateEndlessPrompt();updateEndlessHud();
        if(target.bossAbility==="rift-minion" && endlessState.enemies.length<endlessMaxEnemies()) spawnEndlessEnemy(true);
      }else defeatEndlessEnemy(target);
    }
  }else{
    endlessState.mistakes++;endlessState.combo=0;sndBad();
    const nextLetter=document.getElementById("endlessNextChar");
    if(nextLetter){nextLetter.classList.add("endless-wrong-letter");setTimeout(()=>nextLetter.classList.remove("endless-wrong-letter"),260);}
    const tunnel=document.getElementById("endlessTunnel");if(tunnel){tunnel.classList.remove("tunnel-error");void tunnel.offsetWidth;tunnel.classList.add("tunnel-error");}
    updateEndlessHud();
  }
}
function fireEndlessLaser(enemy,card){
  const field=document.getElementById("endlessField");
  const tunnel=document.getElementById("endlessTunnel");
  if(!field || !tunnel || !card) return;
  const fieldRect=field.getBoundingClientRect();
  const cardRect=card.getBoundingClientRect();
  const x1=fieldRect.width*.5, y1=fieldRect.height*.96;
  const x2=cardRect.left+cardRect.width/2-fieldRect.left;
  const y2=cardRect.top+cardRect.height/2-fieldRect.top;
  const svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("class","endless-laser");svg.setAttribute("viewBox","0 0 "+fieldRect.width+" "+fieldRect.height);
  svg.setAttribute("preserveAspectRatio","none");
  const glow=document.createElementNS(svgNS,"line");
  glow.setAttribute("x1",x1);glow.setAttribute("y1",y1);glow.setAttribute("x2",x2);glow.setAttribute("y2",y2);glow.setAttribute("class","laser-glow");
  const core=document.createElementNS(svgNS,"line");
  core.setAttribute("x1",x1);core.setAttribute("y1",y1);core.setAttribute("x2",x2);core.setAttribute("y2",y2);core.setAttribute("class","laser-core");
  svg.appendChild(glow);svg.appendChild(core);field.appendChild(svg);
  const muzzle=document.querySelector(".tunnel-muzzle");
  if(muzzle){muzzle.classList.remove("fire");void muzzle.offsetWidth;muzzle.classList.add("fire");}
  setTimeout(()=>{svg.remove();},320);
  setTimeout(()=>{if(card.isConnected)card.classList.add("is-destroyed");},80);
}

function defeatEndlessEnemy(enemy){
  if(!endlessState || !endlessState.active)return;
  enemy.destroyed=true;
  enemy.destroyedAt=Date.now();
  if(enemy.isBoss){
    endlessState.bossActive=false;endlessState.bossesDefeated=(endlessState.bossesDefeated||0)+1;
    profile.stats.bossesDefeated=(profile.stats.bossesDefeated||0)+1;
    awardXP(28,"Boss defeated");
    if(endlessState.difficulty==="tutorial") endlessState.tutorialComplete=true;
  }
  const field=document.getElementById("endlessField");
  const card=field && field.querySelector("[data-enemy='"+enemy.id+"']");
  if(card){card.classList.add("laser-hit");}
  fireEndlessLaser(enemy,card);
  endlessState.enemiesDefeated++;
  endlessState.combo++;
  endlessState.bestCombo=Math.max(endlessState.bestCombo,endlessState.combo);
  if(endlessState.currentTargetId===enemy.id) endlessState.currentTargetId=null;
  const points=10+enemy.word.length*2+Math.min(endlessState.combo,8)*3+(enemy.isBoss?180:0);
  endlessState.score+=points;
  endlessState.typed="";
  endlessState.ignoreSpace=true;
  popEndlessPoints(points);
  sndHit(endlessState.combo%5===0);
  setTimeout(()=>{
    if(!endlessState || state.screen!=="endless")return;
    endlessState.enemies=endlessState.enemies.filter(e=>e.id!==enemy.id);
    // Easy immediately supplies the next target. Hard follows its independent
    // spawn clock, allowing several lanes to become active without burst-spawning.
    if(endlessState.tutorialComplete){endEndlessGame("tutorial");return;}
    if(!endlessState.enemies.some(e=>!e.destroyed)){
      // Never leave a lone player waiting after clearing the final visible target.
      if(endlessBossDue() && endlessState.enemies.length<endlessMaxEnemies()) spawnEndlessBoss();
      else spawnEndlessEnemy();
    }
    renderEndlessField();updateEndlessPrompt();updateEndlessHud();
  },430);
  updateEndlessHud();
  updateEndlessPrompt();
}
function popEndlessPoints(points){
  const tunnel=document.getElementById("endlessTunnel");if(!tunnel)return;
  const pop=document.createElement("div");pop.className="endless-points-pop";pop.textContent="+"+points;
  tunnel.appendChild(pop);setTimeout(()=>pop.remove(),850);
}
function pauseEndless(){
  if(state.screen!=="endless"||!endlessState||!endlessState.active)return;
  endlessState.active=false;endlessState.paused=true;endlessState.pausedAt=Date.now();
  clearInterval(endlessState.timerId);endlessState.timerId=null;
  state.screen="endlesspause";render();
}
function resumeEndless(){
  if(state.screen!=="endlesspause"||!endlessState||!endlessState.paused)return;
  const pausedFor=Date.now()-endlessState.pausedAt;
  endlessState.pausedTotal+=pausedFor;endlessState.pausedAt=0;
  endlessState.lastSpawnAt+=pausedFor;
  endlessState.enemies.forEach(enemy=>enemy.spawnAt+=pausedFor);
  endlessState.paused=false;endlessState.active=true;
  state.screen="endless";render();
  endlessState.timerId=setInterval(endlessTick,100);
}
function restartEndless(){startEndlessMode(endlessState?.difficulty||"easy");}
function leaveEndless(){
  if(endlessState && endlessState.timerId)clearInterval(endlessState.timerId);
  if(endlessState){endlessState.active=false;endlessState.paused=false;}
  endlessState=null;state.screen="start";render();
}
function renderEndlessPause(){
  const elapsed=endlessElapsedMs();
  app.innerHTML=
  "<section class='screen pause-screen'><div class='pause-card'><div class='pause-mark'>Ⅱ</div><h1>Endless <span>Paused</span></h1><p class='endless-eyebrow'>"+(endlessModeLabel())+"</p><p class='sub' style='margin:8px auto 0'>Your incoming enemies and score are held in place.</p><div class='pause-meta'><span>Score "+endlessState.score.toLocaleString()+"</span><span>Wave "+String(endlessWave()).padStart(2,"0")+"</span><span>"+endlessState.lives+" lives</span></div><div class='pause-actions'><button class='btn' id='resumeEndless'>Resume</button><button class='btn ghost' id='restartEndless'>Restart</button><button class='btn ghost' id='leaveEndless'>Back to Home</button></div><p class='hint'>Press Esc to resume.</p></div></section>";
  document.getElementById("resumeEndless").addEventListener("click",resumeEndless);
  document.getElementById("restartEndless").addEventListener("click",restartEndless);
  document.getElementById("leaveEndless").addEventListener("click",leaveEndless);
}
function endEndlessGame(outcome="defeat"){
  if(!endlessState || endlessState.recorded)return;
  endlessState.active=false;clearInterval(endlessState.timerId);endlessState.timerId=null;endlessState.recorded=true;
  endlessState.outcome=outcome;
  const duration=endlessElapsedMs(),wpm=endlessWpm(),accuracy=endlessAccuracy();
  const tutorialRun=endlessState.difficulty==="tutorial";
  if(tutorialRun){
    if(outcome==="tutorial") profile.stats.tutorialEndlessWins=(profile.stats.tutorialEndlessWins||0)+1;
    addProfileActivity({mode:"Endless · Tutorial",label:outcome==="tutorial"?"Tutorial cleared":"Tutorial attempt",wpm,accuracy,correctChars:endlessState.correctChars,mistakes:endlessState.mistakes,durationMs:duration});
    awardXP(outcome==="tutorial"?45:10,outcome==="tutorial"?"Tutorial cleared":"Tutorial practice");
  }else{
    profile.stats.endlessRuns=(profile.stats.endlessRuns||0)+1;
    const scoreKey="endlessHardBestScore",waveKey="endlessHardBestWave";
    endlessState.newRecord=endlessState.score>(profile.stats[scoreKey]||0);
    profile.stats[scoreKey]=Math.max(profile.stats[scoreKey]||0,endlessState.score);
    profile.stats[waveKey]=Math.max(profile.stats[waveKey]||0,endlessWave());
    profile.stats.endlessBestScore=Math.max(profile.stats.endlessBestScore||0,endlessState.score);
    profile.stats.endlessBestWave=Math.max(profile.stats.endlessBestWave||0,endlessWave());
    profile.stats.endlessEnemiesDefeated=(profile.stats.endlessEnemiesDefeated||0)+endlessState.enemiesDefeated;
    addProfileActivity({mode:"Endless · Start",label:"Score "+endlessState.score.toLocaleString()+" · "+endlessState.enemiesDefeated+" defeated",wpm,accuracy,correctChars:endlessState.correctChars,mistakes:endlessState.mistakes,durationMs:duration});
    const baseXP=Math.min(150,8+endlessState.enemiesDefeated*2+endlessWave()*3+(endlessState.bossesDefeated||0)*8);
    awardXP(Math.round(baseXP*1.25),"Endless run");
  }
  saveProfile();
  state.screen="endlessresult";render();if(outcome!=="tutorial")sndLose();else sndWin();
}
function renderEndlessResult(){
  const tutorialRun=endlessState.difficulty==="tutorial";
  const tutorialCleared=endlessState.outcome==="tutorial";
  if(tutorialRun){
    app.innerHTML="<section class='screen center endless-result-screen'><div class='endless-eyebrow'>TUTORIAL · "+(tutorialCleared?"COMPLETED":"RUN ENDED")+"</div><h1>"+(tutorialCleared?"Tutorial <span>Cleared!</span>":"Keep <span>Practising</span>")+"</h1><p class='sub'>"+(tutorialCleared?"You defeated your first boss. The full survival challenge is ready.":"The tutorial is a safe place to learn enemy words, lanes and boss phases. Try again when you're ready.")+"</p>"+xpAwardHTML()+"<div class='pause-actions'>"+(tutorialCleared?"<button class='btn' id='startFullEndless'>Start Endless Mode</button>":"")+"<button class='btn ghost' id='replayTutorial'>"+(tutorialCleared?"Replay Tutorial":"Try Tutorial Again")+"</button><button class='btn ghost' id='endlessHome'>Back to Home</button></div></section>";
    const startButton=document.getElementById("startFullEndless");
    if(startButton) startButton.addEventListener("click",()=>startEndlessMode("start"));
    document.getElementById("replayTutorial").addEventListener("click",()=>startEndlessMode("tutorial"));
    document.getElementById("endlessHome").addEventListener("click",leaveEndless);
    return;
  }
  const best=profile.stats.endlessHardBestScore||0;
  app.innerHTML="<section class='screen center endless-result-screen'><div class='endless-eyebrow'>START MODE · RUN COMPLETE</div><h1>Endless <span>Over</span></h1><p class='sub'>The tunnel got the better of you. Your next run starts with a clean slate.</p>"+xpAwardHTML()+"<div class='result endless-result-card'><div class='row score'><span>Final score</span><b>"+endlessState.score.toLocaleString()+"</b></div><div class='row'><span>Wave reached</span><b>"+String(endlessWave()).padStart(2,"0")+"</b></div><div class='row'><span>Enemies defeated</span><b>"+endlessState.enemiesDefeated+"</b></div><div class='row'><span>Bosses defeated</span><b>"+(endlessState.bossesDefeated||0)+"</b></div><div class='row'><span>Typing speed</span><b>"+endlessWpm()+" WPM</b></div><div class='row'><span>Accuracy</span><b>"+endlessAccuracy()+"%</b></div><div class='row'><span>Best score</span><b>"+best+(endlessState.newRecord?" · Personal best":"")+"</b></div></div><div class='pause-actions'><button class='btn' id='playEndlessAgain'>Play Again</button><button class='btn ghost' id='endlessHome'>Back to Home</button></div></section>";
  document.getElementById("playEndlessAgain").addEventListener("click",()=>startEndlessMode("start"));
  document.getElementById("endlessHome").addEventListener("click",leaveEndless);
}

document.getElementById("brandHome").addEventListener("click", goHomeFromLogo);
document.getElementById("dashboardHeaderBtn").addEventListener("click", ()=>{ state.screen="dashboard"; render(); });
document.getElementById("settingsHeaderBtn").addEventListener("click",()=>{state.screen="settings";render();});
document.getElementById("muteBtn").addEventListener("click", function(){
  state.muted = !state.muted;
  appSettings.sound=!state.muted;saveAppSettings();
  this.classList.toggle("on", state.muted);
  this.textContent = state.muted ? "🔇" : "🔊";
  this.setAttribute("aria-pressed", state.muted);
});
document.getElementById("themeBtn").addEventListener("click", ()=>{
  activeTheme = activeTheme === "paper" ? "midnight" : "paper";
  applyTheme();
});
applyTheme();
syncSettingsUI();
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){
    if(state.screen === "fight") { e.preventDefault(); pauseGame(); }
    else if(state.screen === "pause") { e.preventDefault(); resumeGame(); }
    else if(state.screen === "speedtest") { e.preventDefault(); pauseSpeedTest(); }
    else if(state.screen === "speedpause") { e.preventDefault(); resumeSpeedTest(); }
    else if(state.screen === "endless") { e.preventDefault(); pauseEndless(); }
    else if(state.screen === "endlesspause") { e.preventDefault(); resumeEndless(); }
    return;
  }
  if(e.key !== "Enter") return;
  let button = null;
  if(state.screen === "win") button = document.getElementById("nextBtn");
  else if(state.screen === "lose") button = document.getElementById("retryBtn");
  else if(state.screen === "champion") button = document.getElementById("againBtn");
  else if(state.screen === "speedresult") button = document.getElementById("againSB");
  if(button){ e.preventDefault(); button.click(); }
});
render();
</script>
